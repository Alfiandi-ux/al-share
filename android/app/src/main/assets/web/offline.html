<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffd93d">
    <title>Al-share — Offline</title>
    <style>
        :root {
            --ink: #0a0a0a;
            --paper: #f7f1e3;
            --surface: #fffdf6;
            --accent: #ffd93d;
            --muted: #5c5c5c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background-color: var(--paper);
            background-image:
                linear-gradient(rgba(10, 10, 10, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 10, 10, 0.055) 1px, transparent 1px);
            background-size: 28px 28px;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 4px solid var(--ink);
            box-shadow: 8px 8px 0 var(--ink);
            padding: 28px 24px;
            text-align: center;
        }
        .mark {
            width: 84px;
            height: 84px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            background: var(--ink);
            border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--accent);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        p { margin: 0 0 20px; color: var(--muted); font-size: 0.92rem; line-height: 1.55; }
        button {
            width: 100%;
            padding: 14px 18px;
            background: var(--accent);
            border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            font: inherit;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            cursor: pointer;
        }
        button:active { transform: translate(3px, 3px); box-shadow: none; }
        .hint { margin-top: 16px; font-size: 0.75rem; color: var(--muted); }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark">
            <svg viewBox="0 0 100 100" width="56" height="56" aria-hidden="true">
                <polygon points="55,8 24,57 46,57 38,92 75,43 53,43" fill="#ffd93d"/>
            </svg>
        </div>
        <h1>Server Tidak Terjangkau</h1>
        <p>Al-share tidak dapat menghubungi server di jaringan ini. Pastikan server Al-share masih berjalan dan perangkat terhubung ke WiFi yang sama.</p>
        <button type="button" onclick="location.replace('/')">Coba Sambung Ulang</button>
        <div class="hint">Aplikasi tetap tersimpan di perangkat Anda.</div>
    </main>
</body>
</html>
